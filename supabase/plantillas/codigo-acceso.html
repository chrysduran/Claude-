<h2>Tu código para entrar a Pulso Obra</h2>
<p>Escribe este código en la app:</p>
<p style="font-size:32px;font-weight:700;letter-spacing:6px">{{ .Token }}</p>
<p>O toca este enlace desde el teléfono donde abriste la app: <a href="{{ .ConfirmationURL }}">Entrar a Pulso Obra</a></p>
<p>El código vence en una hora. Si no lo pediste, ignora este correo.</p>
